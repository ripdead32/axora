<!DOCTYPE html>
<html>

<head>

<title>Axora Login</title>

<style>

body{

margin:0;

height:100vh;

display:flex;

align-items:center;

justify-content:center;

background:#090014;

color:white;

font-family:Arial;

}


.box{

background:#1e1e32;

padding:40px;

border-radius:20px;

text-align:center;

}


input{

padding:12px;

border:none;

border-radius:10px;

}


button{

margin-top:20px;

padding:12px 30px;

background:#7c5cff;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}

</style>

</head>


<body>


<div class="box">


<h1>

Axora Login

</h1>



<input
id="username"
placeholder="Username">



<br>



<button onclick="login()">

Continue

</button>


</div>




<script>


function login(){


let username =
document
.getElementById("username")
.value
.trim();



if(username=="")
return;



localStorage.setItem(
"loggedIn",
"true"
);


localStorage.setItem(
"username",
username
);


if(!localStorage.getItem("axbux")){

localStorage.setItem(
"axbux",
"0"
);

}



window.location.href="../";


}


</script>


</body>

</html>
