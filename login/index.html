<!DOCTYPE html>
<html>

<head>
<link rel="icon" type="image/png" href="/favicon.png">
<title>Axora Login</title>

<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Arial,sans-serif;

    color:white;

    background:
    linear-gradient(
        135deg,
        #090014,
        #15102b,
        #090014
    );

}


/* Back button */

.back{

    position:absolute;

    top:25px;

    left:25px;

    padding:12px 22px;

    border:none;

    border-radius:12px;

    background:#22223a;

    color:white;

    cursor:pointer;

    transition:.25s;

}



.back:hover{

    transform:translateX(-5px);

    box-shadow:
    0 10px 30px #7c5cff55;

}



/* Login box */

.box{

    width:380px;

    padding:40px;

    text-align:center;

    border-radius:20px;

    background:#1e1e32;

    animation:fade .8s;

}



.logo{

    font-size:45px;

    font-weight:900;

    color:#8b6cff;

}



input{

    width:90%;

    padding:13px;

    margin-top:20px;

    border:none;

    border-radius:10px;

}



button{

    margin-top:20px;

    padding:13px 35px;

    border:none;

    border-radius:12px;

    background:#7c5cff;

    color:white;

    cursor:pointer;

    transition:.25s;

}



button:hover{

    transform:translateY(-3px);

}



.message{

    color:#aaa;

    margin-top:15px;

}



@keyframes fade{

    from{

        opacity:0;

        transform:translateY(40px);

    }

    to{

        opacity:1;

        transform:none;

    }

}


</style>

</head>


<body>



<button class="back" onclick="goBack()">

← Back

</button>




<div class="box">


<div class="logo">

Axora

</div>


<h2>

Login

</h2>



<input
id="username"
placeholder="Username">



<br>



<button onclick="login()">

Continue

</button>



<div class="message" id="message"></div>



</div>






<script>


function goBack(){

    window.location.href="../";

}




function login(){


let username =
document
.getElementById("username")
.value
.trim();



if(username==""){


document
.getElementById("message")
.innerText=
"Please enter a username.";


return;


}



localStorage.setItem(
"loggedIn",
"true"
);



localStorage.setItem(
"username",
username
);



if(!localStorage.getItem("axbux")){

localStorage.setItem(
"axbux",
"0"
);

}



window.location.href="../";


}


</script>



</body>

</html>
