<!DOCTYPE html>
<html>

<head>

<title>Axora Login</title>

<style>

body {

margin:0;

height:100vh;

display:flex;

align-items:center;

justify-content:center;

background:#090014;

font-family:Arial;

color:white;

}


.box {

background:#1e1e32;

padding:40px;

border-radius:20px;

text-align:center;

}


input {

padding:12px;

border-radius:10px;

border:none;

}


button {

margin-top:20px;

padding:12px 30px;

border:none;

border-radius:10px;

background:#7c5cff;

color:white;

cursor:pointer;

}


</style>

</head>


<body>


<div class="box">


<h1>
Axora Login
</h1>


<input
id="username"
placeholder="Username">


<br>


<button onclick="login()">

Continue

</button>


</div>




<script>


function login(){


let user =
document
.getElementById("username")
.value
.trim();



if(user=="")
return;



localStorage.setItem(
"loggedIn",
"true"
);


localStorage.setItem(
"username",
user
);



localStorage.setItem(
"axbux",
localStorage.getItem("axbux") || "0"
);



window.location.href="../";


}


</script>


</body>

</html>
