<!DOCTYPE html>
<html>

<head>

<title>AxBux - Axora</title>


<style>


*{

box-sizing:border-box;

}



body{

margin:0;

font-family:Arial,sans-serif;

background:
linear-gradient(
135deg,
#090014,
#15102b
);

color:white;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

}



/* Back button */


.back{

position:absolute;

top:25px;

left:25px;

padding:12px 22px;

border:none;

border-radius:12px;

background:#22223a;

color:white;

cursor:pointer;

transition:.25s;

}



.back:hover{

transform:translateX(-5px);

box-shadow:
0 10px 30px #7c5cff55;

}




.box{


width:400px;

padding:40px;

border-radius:20px;

background:#1e1e32;

text-align:center;


}




h1{

color:#8b6cff;

}



input{

width:90%;

padding:12px;

border:none;

border-radius:10px;

}



button{

margin-top:15px;

padding:12px 25px;

border:none;

border-radius:10px;

background:#7c5cff;

color:white;

cursor:pointer;

transition:.25s;

}



button:hover{

transform:translateY(-3px);

}



#message{

color:#aaa;

margin-top:15px;

}



</style>

</head>


<body>



<button class="back" onclick="goBack()">

← Back

</button>





<div class="box">


<h1>

💰 AxBux

</h1>



<h2>

Balance

</h2>


<h1 id="balance">

0 AxBux

</h1>




<h2>

🎁 Promo Codes

</h2>



<input
id="promo"
placeholder="Enter code">



<br>



<button onclick="redeem()">

Redeem

</button>



<p id="message"></p>


</div>






<script>


function goBack(){

    window.location.href="../";

}




let axbux =
Number(
localStorage.getItem("axbux")
|| 0
);



document
.getElementById("balance")
.innerText =
axbux+" AxBux";





async function redeem(){


let code =
document
.getElementById("promo")
.value
.toUpperCase();



let response =
await fetch("../promos.json");


let data =
await response.json();



let promo =
data.codes.find(
x=>x.code===code
);



let message =
document.getElementById("message");



if(!promo || !promo.active){


message.innerText=
"Invalid code.";

return;


}





let claimed =
JSON.parse(
localStorage.getItem("claimedPromos")
|| "[]"
);



if(claimed.includes(code)){


message.innerText=
"Already redeemed.";

return;


}





axbux += promo.reward;



localStorage.setItem(
"axbux",
axbux
);



claimed.push(code);



localStorage.setItem(
"claimedPromos",
JSON.stringify(claimed)
);



document
.getElementById("balance")
.innerText =
axbux+" AxBux";



message.innerText =
"Received "
+promo.reward+
" AxBux!";


}



</script>



</body>

</html>
