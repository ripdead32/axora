<!DOCTYPE html>
<html>
<head>

<title>Axora</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin:0;
    font-family: Arial, sans-serif;
    color:white;

    background:
    linear-gradient(
        135deg,
        #090014,
        #15102b,
        #090014
    );

    min-height:100vh;

    overflow-x:hidden;
}


/* Animated background */

body::before {

    content:"";

    position:fixed;

    width:500px;
    height:500px;

    background:#7c5cff;

    filter:blur(180px);

    top:-150px;
    left:-150px;

    animation:
    float 8s infinite alternate;

}


@keyframes float {

    from {
        transform:translate(0,0);
    }

    to {
        transform:translate(250px,200px);
    }

}



/* Navbar */

nav {

    display:flex;

    align-items:center;

    padding:20px 50px;

    background:
    rgba(20,20,35,0.65);

    backdrop-filter:blur(15px);

}



/* Logo */

.logo {

    font-size:42px;

    font-weight:900;

    color:#8b6cff;

    animation:
    fadeDown 1s;

}



.tagline {

    margin-left:20px;

    font-size:18px;

    color:white;

    opacity:.85;

}



.spacer {

    flex:1;

}



button {

    border:none;

    padding:12px 22px;

    border-radius:12px;

    cursor:pointer;

    font-size:15px;

    color:white;

    background:#7c5cff;

    transition:.25s;

}



button:hover {

    transform:translateY(-3px);

    box-shadow:
    0 10px 30px #7c5cff55;

}



.axbux {

    margin-right:15px;

    background:#22223a;

}



.login {

    background:#7c5cff;

}



/* Hero */


.hero {

    text-align:center;

    margin-top:120px;

    animation:
    fadeUp 1s;

}



.hero h1 {

    font-size:60px;

}



.hero p {

    font-size:22px;

    color:#ccc;

}



.play {

    margin-top:30px;

    font-size:20px;

    padding:16px 45px;

}



@keyframes fadeUp {

    from {

        opacity:0;

        transform:translateY(40px);

    }

    to {

        opacity:1;

        transform:none;

    }

}



@keyframes fadeDown {

    from {

        opacity:0;

        transform:translateY(-30px);

    }

    to {

        opacity:1;

        transform:none;

    }

}


</style>

</head>


<body>


<nav>


<div class="logo">
Axora
</div>


<div class="tagline">
Create. Play. Explore.
</div>


<div class="spacer"></div>



<button 
class="axbux"
id="axbuxButton"
style="display:none">

💰 <span id="balance">
0
</span> AxBux

</button>



<button 
class="login"
onclick="login()">

Login

</button>


</nav>




<div class="hero">


<h1>
Welcome to Axora
</h1>


<p>
Create worlds. Play games. Explore experiences.
</p>



<button 
class="play"
onclick="playGame()">

▶ Play Baseplate

</button>


</div>





<script>


let loggedIn =
localStorage.getItem("loggedIn");

let axbux =
localStorage.getItem("axbux") || 0;



function updateUI(){


if(loggedIn){

    document
    .getElementById("axbuxButton")
    .style.display="block";


    document
    .getElementById("balance")
    .innerText=axbux;


}

}



function login(){

    localStorage.setItem(
        "loggedIn",
        "true"
    );


    loggedIn=true;

    updateUI();


    alert(
    "Prototype login successful!"
    );

}



function playGame(){

    window.location.href=
    "axora://game/baseplate";

}



updateUI();


</script>


</body>
</html>
